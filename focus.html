<!DOCTYPE html>
<html lang="en" data-theme="Midnight">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Focus — Study clock</title>
<style>
  :root { color-scheme: dark; --page: #0d1118; --bg: #141820; --fg: #f2f4f8; --muted: #a4adbd; --accent: #b5c6ff; --surface: #242c3b; --border: #394459; }
  [data-theme="Paper"] { color-scheme: light; --page: #eae5db; --bg: #faf7f0; --fg: #292b32; --muted: #64646c; --accent: #5554a5; --surface: #eae5db; --border: #c9c3b8; }
  [data-theme="Forest"] { color-scheme: dark; --page: #0c1915; --bg: #12231e; --fg: #edf5ee; --muted: #a0b9ab; --accent: #a6dbb5; --surface: #233c31; --border: #3e5d4d; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: var(--page); color: var(--fg); font-family: 'Segoe UI', system-ui, sans-serif; }
  button, input, select { font: inherit; }
  button, select { cursor: pointer; }
  button { min-height: 44px; border: 1px solid transparent; border-radius: 10px; background: var(--surface); color: var(--fg); padding: 10px 16px; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  button:disabled { cursor: default; opacity: .55; }
  .app { width: min(520px, 100%); }
  .eyebrow { color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .18em; text-transform: uppercase; }
  .intro { margin: 0 0 16px 4px; }
  .card { padding: 28px; border: 1px solid var(--border); border-radius: 24px; background: var(--bg); box-shadow: 0 24px 70px #00000020; }
  header, .toolbar, .footer, .theme-row, .settings-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { font-size: 18px; font-weight: 600; letter-spacing: -.03em; margin: 0; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .mark { width: 12px; height: 12px; border: 3px solid var(--accent); border-radius: 50%; }
  .quiet { background: transparent; color: var(--muted); }
  .toolbar { margin-top: 28px; }
  .tabs { display: flex; padding: 4px; border-radius: 12px; background: var(--surface); }
  .tabs button { background: transparent; padding: 8px 18px; }
  .tabs button[aria-pressed="true"] { background: var(--bg); color: var(--accent); box-shadow: 0 2px 5px #00000018; }
  .display { padding: 34px 0 30px; text-align: center; }
  .status { min-height: 16px; color: var(--accent); font-size: 11px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; }
  .digits { margin: 12px 0 10px; font: 400 clamp(48px, 13vw, 76px)/1.15 'Consolas', 'Courier New', monospace; letter-spacing: -.06em; font-variant-numeric: tabular-nums; }
  .digits.clock { font-size: clamp(36px, 10vw, 60px); }
  .detail { color: var(--muted); font-size: 13px; min-height: 20px; }
  .terminal { container-type: inline-size; font: 12px/1.5 'Consolas', 'Courier New', monospace; font-variant-numeric: tabular-nums; }
  .progress-heading, .progress-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); }
  .progress-heading { margin-bottom: 8px; }
  .progress-heading strong { color: var(--accent); font-weight: normal; }
  .progress-meta { margin-top: 8px; font-size: 11px; }
  .progress-track { height: 28px; display: flex; align-items: center; color: var(--accent); }
  .progress-cells { display: grid; grid-template-columns: repeat(20, minmax(0, 1fr)); gap: 4px; width: 100%; height: 16px; }
  .progress-cell { border: 1px solid var(--border); background: var(--surface); }
  .progress-cell.filled { background: var(--accent); border-color: var(--accent); }
  .installer-bar { width: 100%; white-space: pre; text-align: center; font-size: clamp(12px, 5.5cqw, 26px); line-height: 1; letter-spacing: 0; }
  .ascii-bar { width: 100%; text-align: center; white-space: pre; font-size: clamp(11px, 3.1vw, 16px); letter-spacing: 0; }
  .bar-picker { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; color: var(--muted); font-size: 12px; }
  .bar-picker select { max-width: 65%; }
  .footer { margin-top: 20px; }
  .remaining { color: var(--muted); font-size: 12px; line-height: 1.8; }
  .remaining strong { display: block; color: var(--fg); font-size: 15px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .controls { display: flex; gap: 8px; }
  .primary { background: var(--accent); color: var(--bg); min-width: 104px; font-weight: 600; }
  .theme-row { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
  .theme-picker { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; }
  select, input { min-height: 44px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--fg); padding: 8px 12px; }
  .settings { border-top: 1px solid var(--border); margin-top: 20px; padding-top: 16px; }
  .settings-row { margin: 12px 0; font-size: 13px; }
  .settings-row input { width: 84px; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.6; }
  .keyboard-hint { text-align: center; margin-top: 20px; }
  kbd { font: inherit; padding: 2px 6px; border: 1px solid var(--border); border-radius: 4px; }
  .revive { position: fixed; right: 24px; bottom: 24px; background: var(--bg); border-color: var(--border); }
  @media (max-width: 420px) { body { padding: 16px; } .card { padding: 20px; } .tabs button { padding: 8px 12px; } .toolbar { gap: 4px; } .footer { flex-wrap: wrap; } .controls { flex: 1; justify-content: flex-end; } .primary { min-width: 88px; } .theme-row { gap: 4px; } .theme-picker { gap: 6px; } }
</style>
</head>
<body>
<main class="app" id="app">
  <p class="eyebrow intro">A little space to concentrate</p>
  <section class="card" aria-label="Study clock">
    <header>
      <div class="brand"><span class="mark" aria-hidden="true"></span><h1>Focus</h1></div>
      <button class="quiet" id="hideBtn" title="Hide and pause timer">Hide <span aria-hidden="true">↘</span></button>
    </header>
    <div class="toolbar">
      <div class="tabs" role="group" aria-label="Display mode">
        <button id="timerTab" aria-pressed="true">Focus timer</button>
        <button id="clockTab" aria-pressed="false">Clock</button>
      </div>
      <button class="quiet" id="formatBtn" title="Switch clock time format">24 hour</button>
    </div>
    <div class="display">
      <div class="status" id="status" role="status">Ready to focus</div>
      <div class="digits" id="display" role="timer" aria-label="Session time remaining">25:00</div>
      <div class="detail" id="detail">Session 1 of 5 · Make room for one thing.</div>
    </div>
    <div class="terminal">
      <div class="progress-heading"><span id="progressLabel">FOCUS SESSION</span><strong id="progressPercent">0%</strong></div>
      <div id="progress" class="progress-track" data-style="Installer" role="progressbar" aria-label="Session progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-cells" id="progressCells" aria-hidden="true"></div>
        <div class="installer-bar" id="installerBar" aria-hidden="true"></div>
        <div class="ascii-bar" id="asciiBar" aria-hidden="true" hidden></div>
      </div>
      <div class="progress-meta"><span id="progressStatus">READY</span><span id="progressRemaining">25:00 left</span></div>
    </div>
    <div class="footer">
      <div class="remaining">Daily goal remaining<strong id="remaining">02:05:00</strong></div>
      <div class="controls">
        <button class="primary" id="playBtn">Start</button>
        <button id="resetBtn" title="Reset current session">Reset</button>
      </div>
    </div>
    <div class="theme-row">
      <label class="theme-picker" for="theme">Theme <select id="theme"><option>Midnight</option><option>Paper</option><option>Forest</option></select></label>
      <button class="quiet" id="settingsBtn" aria-expanded="false" aria-controls="settings">Settings</button>
    </div>
    <label class="bar-picker" for="progressStyle">Progress bar
      <select id="progressStyle">
        <option value="Installer">Package installer</option>
        <option value="ASCII">ASCII terminal</option>
        <option value="Segments">Retro segments</option>
      </select>
    </label>
    <section class="settings" id="settings" aria-label="Timer settings" hidden>
      <div class="settings-row"><label for="sessionMin">Session length (minutes)</label><input type="number" id="sessionMin" min="5" max="60" step="1" value="25"></div>
      <div class="settings-row"><label for="dailySessions">Daily sessions</label><input type="number" id="dailySessions" min="1" max="20" step="1" value="5"></div>
      <p class="hint" id="settingsHint">Changing the plan starts a fresh daily goal.</p>
    </section>
  </section>
  <p class="hint keyboard-hint"><kbd>Space</kbd> to start or pause · One session at a time.</p>
</main>
<button class="revive" id="reviveBtn" hidden>↗ Open Focus</button>
<script>
  const $ = id => document.getElementById(id);
  const themes = ['Midnight', 'Paper', 'Forest'];
  const progressStyles = ['Installer', 'ASCII', 'Segments'];
  let progressStyle = 'Installer';
  let sessionMinutes = 25;
  let dailySessions = 5;
  let sessionsCompleted = 0;
  let totalSeconds = sessionMinutes * 60;
  let secondsLeft = totalSeconds;
  let state = 'idle';
  let mode = 'timer';
  let use24Hour = true;
  let deadline = 0;
  let intervalId = null;

  try {
    const prefs = JSON.parse(localStorage.getItem('focus.preferences')) || {};
    if (themes.includes(prefs.theme)) $('theme').value = prefs.theme;
    use24Hour = prefs.use24Hour !== false;
    if (progressStyles.includes(prefs.progressStyle)) progressStyle = prefs.progressStyle;
  } catch { /* The clock also works when browser storage is unavailable. */ }
  document.documentElement.dataset.theme = $('theme').value;
  $('progressStyle').value = progressStyle;

  function savePreferences() {
    try { localStorage.setItem('focus.preferences', JSON.stringify({ theme: $('theme').value, use24Hour, progressStyle })); } catch {}
  }
  function fmtMS(s) { return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); }
  function fmtHMS(s) { return String(Math.floor(s / 3600)).padStart(2, '0') + ':' + fmtMS(s % 3600); }
  function dailyRemainingSeconds() {
    const elapsed = sessionsCompleted * totalSeconds + (state === 'completed' ? 0 : totalSeconds - secondsLeft);
    return Math.max(0, dailySessions * totalSeconds - elapsed);
  }
  function renderClock() {
    if (mode !== 'clock') return;
    const now = new Date();
    $('display').textContent = now.toLocaleTimeString('en-GB', { hour12: !use24Hour, hour: '2-digit', minute: '2-digit', second: '2-digit' }).replace(/\s[ap]m$/i, '');
    $('detail').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' }) + (use24Hour ? '' : (now.getHours() >= 12 ? ' · PM' : ' · AM'));
  }
  function renderProgress() {
    const fraction = Math.max(0, Math.min(1, totalSeconds ? (totalSeconds - secondsLeft) / totalSeconds : 0));
    const percent = Math.floor(fraction * 100);
    const status = ({ idle: 'READY', running: 'STUDYING', paused: 'PAUSED', completed: 'DONE' })[state];
    $('progress').dataset.style = progressStyle;
    $('progress').setAttribute('aria-valuenow', String(percent));
    $('progress').setAttribute('aria-valuetext', `${percent}% · ${status.toLowerCase()} · ${fmtMS(secondsLeft)} remaining`);
    $('progressPercent').textContent = `${percent}%`;
    $('progressLabel').textContent = progressStyle === 'ASCII' ? '$ focus --session' : 'FOCUS SESSION';
    $('progressStatus').textContent = status;
    $('progressRemaining').textContent = `${fmtMS(secondsLeft)} left`;
    const ascii = progressStyle === 'ASCII';
    const installer = progressStyle === 'Installer';
    $('asciiBar').hidden = !ascii;
    $('installerBar').hidden = !installer;
    $('progressCells').hidden = ascii || installer;
    if (installer) {
      const filled = Math.floor(fraction * 28);
      $('installerBar').textContent = '[' + '█'.repeat(filled) + '░'.repeat(28 - filled) + ']';
    } else if (ascii) {
      const filled = Math.floor(fraction * 30);
      $('asciiBar').textContent = '[' + '='.repeat(filled) + (filled < 30 ? '>' + '-'.repeat(29 - filled) : '') + ']';
    } else {
      const count = 20;
      const filled = Math.floor(fraction * count);
      if ($('progressCells').children.length !== count) {
        $('progressCells').replaceChildren(...Array.from({ length: count }, () => {
          const cell = document.createElement('span');
          cell.className = 'progress-cell';
          return cell;
        }));
      }
      Array.from($('progressCells').children).forEach((cell, index) => cell.classList.toggle('filled', index < filled));
    }
  }
  function render() {
    const clockMode = mode === 'clock';
    const finishedGoal = sessionsCompleted >= dailySessions;
    $('display').classList.toggle('clock', clockMode);
    $('display').setAttribute('aria-label', clockMode ? 'Current local time' : 'Session time remaining');
    $('timerTab').setAttribute('aria-pressed', String(!clockMode));
    $('clockTab').setAttribute('aria-pressed', String(clockMode));
    $('formatBtn').textContent = use24Hour ? '24 hour' : '12 hour';
    $('status').textContent = clockMode ? 'Local time' : ({ idle: 'Ready to focus', running: 'Focus time', paused: 'Paused · take your time', completed: finishedGoal ? 'Daily goal complete' : 'Session complete' })[state];
    if (clockMode) renderClock();
    else {
      $('display').textContent = fmtMS(secondsLeft);
      $('detail').textContent = state === 'completed' ? `${sessionsCompleted} of ${dailySessions} sessions complete. Nicely done.` : `Session ${Math.min(sessionsCompleted + 1, dailySessions)} of ${dailySessions} · Make room for one thing.`;
    }
    $('remaining').textContent = fmtHMS(dailyRemainingSeconds());
    renderProgress();
    $('playBtn').textContent = ({ idle: 'Start', running: 'Pause', paused: 'Resume', completed: finishedGoal ? 'New goal' : 'Next session' })[state];
    const locked = state === 'running' || state === 'paused';
    $('sessionMin').disabled = locked;
    $('dailySessions').disabled = locked;
    $('settingsHint').textContent = locked ? 'Reset the timer to change your plan.' : 'Changing the plan starts a fresh daily goal.';
    document.title = state === 'running' ? `${fmtMS(secondsLeft)} · Focus` : 'Focus — Study clock';
  }
  function tick() {
    if (state !== 'running') return;
    secondsLeft = Math.max(0, Math.ceil((deadline - Date.now()) / 1000));
    if (secondsLeft === 0) {
      clearInterval(intervalId);
      intervalId = null;
      state = 'completed';
      sessionsCompleted++;
    }
    render();
  }
  function start() {
    if (state === 'running') return;
    if (state === 'completed') {
      if (sessionsCompleted >= dailySessions) sessionsCompleted = 0;
      secondsLeft = totalSeconds;
    }
    state = 'running';
    deadline = Date.now() + secondsLeft * 1000;
    intervalId = setInterval(tick, 200);
    render();
  }
  function pause() {
    if (state !== 'running') return;
    tick();
    if (state === 'completed') return;
    state = 'paused';
    clearInterval(intervalId);
    intervalId = null;
    render();
  }
  function reset() {
    clearInterval(intervalId);
    intervalId = null;
    if (sessionsCompleted >= dailySessions) sessionsCompleted = 0;
    state = 'idle';
    totalSeconds = sessionMinutes * 60;
    secondsLeft = totalSeconds;
    render();
  }
  function togglePlay() { if (state === 'running') pause(); else start(); }
  function setMode(value) { mode = value; render(); }
  function updatePlan() {
    if (state === 'running' || state === 'paused') return;
    sessionMinutes = Math.max(5, Math.min(60, parseInt($('sessionMin').value, 10) || 25));
    dailySessions = Math.max(1, Math.min(20, parseInt($('dailySessions').value, 10) || 5));
    $('sessionMin').value = sessionMinutes;
    $('dailySessions').value = dailySessions;
    sessionsCompleted = 0;
    reset();
  }
  $('playBtn').addEventListener('click', togglePlay);
  $('resetBtn').addEventListener('click', reset);
  $('timerTab').addEventListener('click', () => setMode('timer'));
  $('clockTab').addEventListener('click', () => setMode('clock'));
  $('formatBtn').addEventListener('click', () => { use24Hour = !use24Hour; savePreferences(); render(); });
  $('theme').addEventListener('change', () => { document.documentElement.dataset.theme = $('theme').value; savePreferences(); });
  $('progressStyle').addEventListener('change', () => {
    progressStyle = $('progressStyle').value;
    renderProgress();
    savePreferences();
  });
  $('settingsBtn').addEventListener('click', () => {
    $('settings').hidden = !$('settings').hidden;
    $('settingsBtn').setAttribute('aria-expanded', String(!$('settings').hidden));
  });
  $('sessionMin').addEventListener('change', updatePlan);
  $('dailySessions').addEventListener('change', updatePlan);
  $('hideBtn').addEventListener('click', () => { pause(); $('app').hidden = true; $('reviveBtn').hidden = false; $('reviveBtn').focus(); });
  $('reviveBtn').addEventListener('click', () => { $('app').hidden = false; $('reviveBtn').hidden = true; $('hideBtn').focus(); });
  document.addEventListener('keydown', event => {
    if (event.code === 'Space' && !event.repeat && !$('app').hidden && !['INPUT', 'SELECT', 'BUTTON', 'TEXTAREA'].includes(event.target.tagName)) {
      event.preventDefault();
      togglePlay();
    }
  });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); renderClock(); } });
  setInterval(renderClock, 1000);
  render();
</script>
</body>
</html>
